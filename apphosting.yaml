# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# IMPORTANT : App Hosting attend un unique bloc `env`.
# Les anciennes cles `environmentVariables` / `secretEnvironmentVariables`
# sont ignorees silencieusement par le build : aucune variable n'etait montee
# dans le conteneur, d'ou les erreurs 500 sur /api/stripe/checkout.
#
# `availability` precise ou la variable est disponible :
#   BUILD   -> pendant la compilation (necessaire pour les NEXT_PUBLIC_*)
#   RUNTIME -> a l'execution du serveur (necessaire pour les routes API)
env:
  # --- Valeurs publiques ---
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    value: AZSVA1R4EqfYKQEnx2djfVOuVbDe9XZBL2DDnLkBiOWJ6a9ucmjbyAyszvjmu0908BwMvH2srgp1Wewg
    availability:
      - BUILD
      - RUNTIME

  - variable: PAYPAL_BASE_URL
    value: https://api-m.paypal.com
    availability:
      - RUNTIME

  # Expediteur des e-mails transactionnels (Brevo).
  # Doit correspondre a un expediteur verifie dans Brevo, sinon l'API refuse
  # l'envoi. A remplacer par contact@dubainegoce.fr une fois le domaine
  # authentifie dans Brevo (meilleure delivrabilite).
  - variable: FROM_EMAIL
    value: abderelmalki@gmail.com
    availability:
      - RUNTIME

  - variable: FROM_NAME
    value: DubaiNegoce
    availability:
      - RUNTIME

  # Comptes autorises a acceder a /admin et aux routes /api/admin/*
  # (plusieurs adresses : separer par des virgules).
  - variable: NEXT_PUBLIC_ADMIN_EMAILS
    value: weblinecreation88@gmail.com
    availability:
      - BUILD
      - RUNTIME

  # --- Secrets (Google Cloud Secret Manager) ---
  - variable: PAYPAL_CLIENT_ID
    secret: PAYPAL_CLIENT_ID
    availability:
      - RUNTIME

  - variable: PAYPAL_SECRET
    secret: PAYPAL_SECRET
    availability:
      - RUNTIME

  # Cle secrete LIVE de Stripe (sk_live_...)
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Signature du webhook LIVE de Stripe (whsec_...)
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Cle API Brevo pour les e-mails transactionnels (xkeysib-...)
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME

  # Token protegeant l'appel cron depuis Cloud Scheduler
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

headers:
  - # Set a Cache-Control header for all static assets.
    source: /_next/static/**
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - # Add security headers to all responses.
    source: /**
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-XSS-Protection
        value: "1; mode=block"
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: >-
          frame-ancestors 'self';
          upgrade-insecure-requests;
